[package]
name = "preset-gg-api"
version = "0.1.0"
edition = "2021"
description = "Preset.gg — AI Audio-to-Preset backend API"

[dependencies]
# Web framework
axum = { version = "0.8", features = ["json", "multipart"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# HTTP client (for Gemini, Audius, Supabase APIs)
reqwest = { version = "0.12", features = ["json", "stream"] }

# Base64 encoding (for Gemini audio inline data)
base64 = "0.22"

# Async stream utilities (for reading chunked responses)
futures-util = "0.3"

# Solana
solana-client = "2.2"
solana-sdk = "2.2"
spl-token = "7"
spl-associated-token-account = "6"

# Environment & config
dotenvy = "0.15"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1"
thiserror = "2"

# UUID generation
uuid = { version = "1", features = ["v4"] }
